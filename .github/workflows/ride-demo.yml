name: 올라타기 시연 영상

on:
  push:
    branches: [claude/window-ride-demo]

permissions:
  contents: write

jobs:
  demo:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한국 시간대
        run: tzutil /s "Korea Standard Time"

      - name: ffmpeg 준비
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          ffmpeg -version | Select-Object -First 1

      - name: exe 빌드
        # 버전을 높게 잡아 시연 중에 업데이트 창이 뜨지 않게
        run: .\build.ps1 -Version 99.0.0

      - name: 시연 녹화
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class W {
            public struct RECT { public int L, T, R, B; }
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            public static RECT[] ProcRects(uint pid) {
              var list = new List<RECT>();
              EnumWindows((h, l) => { uint p; RECT r; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h) && GetWindowRect(h, out r)) list.Add(r); return true; }, IntPtr.Zero);
              return list.ToArray();
            }
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte sc, uint f, UIntPtr e);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int hh, bool r);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
          }
          "@
          New-Item -ItemType Directory -Force shots | Out-Null
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen: $($b.Width)x$($b.Height)"
          function Shot($name) {
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose(); "shot $name"
          }
          function Keys([byte[]]$vks) {
            foreach ($k in $vks) { [W]::keybd_event($k, 0, 0, [UIntPtr]::Zero) }
            [array]::Reverse($vks)
            foreach ($k in $vks) { [W]::keybd_event($k, 0, 2, [UIntPtr]::Zero) }
          }
          function Click($x, $y) {
            [W]::SetCursorPos($x, $y) | Out-Null; Start-Sleep -Milliseconds 200
            [W]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 80
            [W]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero)
          }
          function OpenNote($file, $x, $y, $w, $h) {
            $p = Start-Process notepad -ArgumentList $file -PassThru
            $hw = [IntPtr]::Zero
            for ($i = 0; $i -lt 60 -and $hw -eq [IntPtr]::Zero; $i++) {
              Start-Sleep -Milliseconds 100; $p.Refresh(); $hw = $p.MainWindowHandle
            }
            [W]::MoveWindow($hw, $x, $y, $w, $h, $true) | Out-Null
            return $hw
          }

          $dir = "dist\CharacterPlan"; $exe = "$dir\CharacterPlan.exe"; $data = "$dir\data"
          New-Item -ItemType Directory -Force $data | Out-Null
          $px = $b.Width - 330; $py = $b.Height - 330
          @{ user_name = "지유"; character = "chiikawa"; character_size = 160; sound_volume = 0
             briefing = "startup"; ride_windows = $true; pos_x = $px; pos_y = $py } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$data\settings.json"
          Set-Content -Encoding utf8 memo.txt "회의 준비 메모`r`n- 자료 출력하기`r`n- 3층 회의실"
          Set-Content -Encoding utf8 todo.txt "오늘 할 일`r`n- 점심 약속 12:30"

          (New-Object -ComObject Shell.Application).MinimizeAll(); Start-Sleep 2

          # 일정 알림 시각 맞추기: 매분 20초에 앱을 켜면, 다음 정각 분 + 10분 일정의
          # '10분 전 알림'이 앱 실행 약 50초 뒤(15초마다 확인)에 온다.
          while ((Get-Date).Second -ne 19) { Start-Sleep -Milliseconds 200 }
          $now = Get-Date
          $boundary = $now.AddSeconds(60 - $now.Second).AddMilliseconds(-$now.Millisecond)
          $meet = $boundary.AddMinutes(10)
          @{ version = 1; schedules = @(@{ title = "회의"; date = $meet.ToString("yyyy-MM-dd"); time = $meet.ToString("HH:mm") }) } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "$data\schedules.json"

          $ff = Start-Process ffmpeg -PassThru -NoNewWindow -ArgumentList (
            "-y -loglevel error -f gdigrab -framerate 30 -i desktop -t 72 " +
            "-c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p shots\ride-demo.mp4")
          Start-Sleep 1

          # 1) 앱 실행: 바탕화면 자리에서 오늘 일정 브리핑 (말풍선이 보이는지)
          $app = Start-Process $exe -PassThru; Start-Sleep 7; Shot "01-briefing-home"
          Start-Sleep 3

          # 2) 메모장 A → 올라탄다
          $NoteA = OpenNote "memo.txt" 40 170 460 280
          Click 270 330; Start-Sleep 4; Shot "02-ride-a"

          # 3) 창 A 를 끌어 옮기면 → 따라간다
          for ($i = 0; $i -le 30; $i++) {
            [W]::MoveWindow($NoteA, 40 + $i * 6, 170 - [int](10 * [math]::Sin($i / 5.0)), 460, 280, $true) | Out-Null
            Start-Sleep -Milliseconds 40
          }
          Start-Sleep 2

          # 4) 메모장 B → 옮겨 탄다, A 클릭 → 다시 A
          $NoteB = OpenNote "todo.txt" 560 140 360 200
          Click 760 260; Start-Sleep 3; Shot "03-ride-b"
          Click 400 380; Start-Sleep 3; Shot "04-ride-a"

          # 5) 일정 알림이 올 때까지 기다림 (A 위에서 쉬거나 걸어 다니는 중)
          $deadline = (Get-Date).AddSeconds(80)
          while ((Get-Date) -lt $deadline) {
            $j = Get-Content "$data\schedules.json" -Raw | ConvertFrom-Json
            if ($j.schedules[0].notified_before) { break }
            Start-Sleep -Milliseconds 200
          }
          "alert at +$([int]((Get-Date) - $now).TotalSeconds)s"
          Start-Sleep -Milliseconds 300; Shot "05-alert-jumping-down"
          Start-Sleep 3; Shot "06-alert-speaking-home"
          Start-Sleep 2

          # 6) 말풍선 클릭해서 닫기 → 다시 A 위로
          $rects = [W]::ProcRects([uint32]$app.Id) | Where-Object { ($_.R - $_.L) -lt 600 -and ($_.B - $_.T) -lt 300 } |
            Sort-Object T
          "our windows: $($rects | ForEach-Object { "$($_.L),$($_.T),$($_.R),$($_.B)" })"
          $bub = $rects[0]
          Click ([int](($bub.L + $bub.R) / 2)) ([int](($bub.T + $bub.B) / 2) - 6); Start-Sleep 3; Shot "07-back-up"

          $ff.WaitForExit()
          Get-Item shots\ride-demo.mp4 | Select-Object Name, Length
          if (Test-Path "$data\error.log") { "=== error.log ==="; Get-Content "$data\error.log" }

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f shots
          git commit -m "ride demo" -q
          foreach ($i in 1..5) {
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 10
          }
          exit 1
