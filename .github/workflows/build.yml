name: Windows 빌드

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Inno Setup 설치
        run: choco install innosetup -y --no-progress

      - name: exe + 설치 파일 빌드
        shell: pwsh
        run: .\build.ps1 -Installer

      - name: 실행 파일(압축) 업로드
        uses: actions/upload-artifact@v4
        with:
          name: CharacterPlan-portable
          path: dist/CharacterPlan

      - name: 설치 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: CharacterPlan-Setup
          path: installer_output/CharacterPlan-Setup.exe

      # v로 시작하는 태그(예: v0.1.0)를 푸시하면 Releases 페이지에도 올림
      - name: 릴리스 생성
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CharacterPlan/* -DestinationPath CharacterPlan-portable.zip
          gh release create "${{ github.ref_name }}" installer_output/CharacterPlan-Setup.exe CharacterPlan-portable.zip --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
