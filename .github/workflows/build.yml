name: Windows 빌드

# main 에 올릴 때마다: exe + 설치 파일을 만들고, 새 버전으로 Releases 에 올린다.
# 설치된 앱은 켜질 때 Releases 의 최신 버전을 확인해서 자동으로 업데이트한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 지난 릴리스 이후 커밋으로 '달라진 점'을 만들기 위해

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 버전 번호 정하기
        id: ver
        shell: pwsh
        run: echo "version=0.2.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Inno Setup 설치
        run: choco install innosetup -y --no-progress

      - name: exe + 설치 파일 빌드
        shell: pwsh
        run: .\build.ps1 -Installer -Version ${{ steps.ver.outputs.version }}

      - name: 실행 파일(압축) 업로드
        uses: actions/upload-artifact@v4
        with:
          name: CharacterPlan-portable
          path: dist/CharacterPlan

      - name: 설치 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: CharacterPlan-Setup
          path: installer_output/CharacterPlan-Setup.exe

      - name: 릴리스 올리기 (자동 업데이트용)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $v = "v${{ steps.ver.outputs.version }}"
          python tools/release_notes.py notes.md
          Compress-Archive -Path dist/CharacterPlan/* -DestinationPath CharacterPlan-portable.zip
          gh release create $v installer_output/CharacterPlan-Setup.exe CharacterPlan-portable.zip --title $v --notes-file notes.md --target $env:GITHUB_SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
